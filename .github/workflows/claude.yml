# Lets you hand work to Claude from GitHub.
# Mention @claude in an issue (title or body), an issue comment, or a PR review comment.
# Claude reads CLAUDE.md, makes the change on a branch, and opens or updates a pull request.
#
# Needs the repository secret CLAUDE_CODE_OAUTH_TOKEN (Settings > Secrets and variables > Actions),
# made with `claude setup-token` on a computer. Runs count toward the Pro plan's usage limits.
# Only people with write access to the repo can trigger it.

name: Claude Code

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened, assigned]
  pull_request_review:
    types: [submitted]

jobs:
  claude:
    if: |
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude')) ||
      (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')))
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read # lets Claude read CI results on PRs
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run Claude Code
        uses: anthropics/claude-code-action@v1
        with:
          # Uses the Pro plan token from `claude setup-token`.
          # To pay per use instead, add an ANTHROPIC_API_KEY secret and swap this line for:
          #   anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # Shell commands are off by default. These let Claude run the checks in CLAUDE.md.
          claude_args: |
            --allowedTools "Bash(npm ci),Bash(npm install:*),Bash(npm test),Bash(npm run test:*),Bash(npm run build),Bash(npm run typecheck),Bash(npx vitest:*),Bash(git:*)"
